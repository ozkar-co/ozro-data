# Extractor dependency order. Downstream may read upstream normalized records only.
version: 1

order:
  - discovery
  - maps
  - mobs
  - items
  - npcs
  - map_connections   # needs maps + npcs
  - spawns            # needs maps + mobs
  - item_scripts      # needs items
  - item_restrictions # needs items
  - drops             # needs mobs + items + config resolver
  - shops             # needs npcs + items
  - quests            # needs npcs + items + mobs
  - instances         # needs maps + npcs
  - boxes             # needs items
  - recipes           # needs items + npcs
  - enchantments      # needs items + npcs
  - item_relationships
  - random_options    # needs drops for links
  - barters           # needs items (+ npcs optional)
  - npc_enchants      # needs items + discovery scripts
  - acquisition       # union of catalog extracts
  - item_dependencies # §22.2 graph from prior reports
  - npc_script_rewards
  - closure_sanity
  - map_distances     # needs map_connections
  - provenance
  - sql_sync

depends:
  maps: [discovery]
  mobs: [discovery]
  items: [discovery]
  npcs: [discovery, maps]
  map_connections: [maps, npcs]
  spawns: [maps, mobs]
  item_scripts: [items]
  item_restrictions: [items]
  drops: [mobs, items]
  shops: [npcs, items]
  quests: [npcs, items, mobs]
  instances: [maps, npcs]
  boxes: [items]
  recipes: [items, npcs]
  enchantments: [items, npcs]
  item_relationships: [items]
  random_options: [drops]
  barters: [items, npcs]
  npc_enchants: [items]
  acquisition: [drops, shops, boxes, recipes, quests, barters, npc_enchants, npc_script_rewards]
  item_dependencies: [recipes, barters, item_relationships, npc_enchants, boxes]
  npc_script_rewards: [items, npcs]
  closure_sanity: [barters, item_dependencies, npc_script_rewards, acquisition]
  map_distances: [map_connections, maps]
  provenance: []
  sql_sync: [map_distances, provenance]

# Machine-readable source registry. Paths relative to paths.rathena / paths.ozro_cli.
# Truth for transport/connections: warps + NPC scripts in rathena only.

version: 1

domains:
  maps:
    sources:
      - kind: maps_conf
        path: conf/maps_athena.conf
        note: enabled map: lines only
      - kind: map_index
        path: db/map_index.txt
      - kind: client_grf
        repo: ozro_cli
        note: presence of map resources in GRF/patch

  map_connections:
    sources:
      - kind: warp_scripts
        entry: npc/re/scripts_main.conf
        via: [npc/scripts_warps.conf, npc/re/scripts_warps.conf]
        note: warp portal lines
      - kind: npc_scripts
        entry: npc/re/scripts_main.conf
        note: kafra, airport, boat, scripted warps; parse warp/warpparty/callfunc destinations
      - kind: ozro_custom_warps
        path: npc/custom/ozro/warps/
        loaded_via: npc/scripts_custom.conf
        note: F_OzroWarp (zeny + Blue Gemstone)

  npcs:
    sources:
      - kind: npc_scripts
        entry: npc/re/scripts_main.conf
        note: all enabled npc:/import: recursively

  shops:
    sources:
      - kind: shop_headers
        entry: npc/re/scripts_main.conf
        note: shop/cashshop/itemshop/pointshop/marketshop headers
      - kind: callshop_links
        entry: npc/re/scripts_main.conf
        note: callshop literal/prefix → shop_id; barter names classified only
      - kind: deferred
        note: barter_db inventory, dynamic callshop arrays, buysell scripted

  npc_scripts:
    sources:
      - kind: script_bodies
        entry: npc/re/scripts_main.conf
        note: Etapa 3 evidence → refine functions; after Skills

  mobs:
    sources:
      - kind: yaml
        path: db/re/mob_db.yml
      - kind: yaml_override
        path: db/import/mob_db.yml
      - kind: conf
        path: conf/import/battle_conf.txt
        keys: [monster_hp_rate, mvp_hp_rate, base_exp_rate, job_exp_rate, mvp_exp_rate]

  spawns:
    sources:
      - kind: spawn_scripts
        via: [npc/scripts_monsters.conf, npc/re/scripts_monsters.conf]
      - kind: scripted_spawn
        entry: npc/re/scripts_main.conf
        note: monster/areamonster/guardian in NPC scripts
      - kind: mob_skill_slaves
        path: db/re/mob_skill_db.txt
        note: NPC_SUMMONSLAVE / NPC_SUMMONMONSTER → spawn_type slave

  skills:
    sources:
      - kind: mob_skill_db
        path: db/re/mob_skill_db.txt
        note: monster skills + slave summons; Etapa 3 before NPC analysis
      - kind: skill_db
        path: db/re/skill_db.yml
        note: player skill summons deferred

  items:
    sources:
      - kind: yaml
        paths:
          - db/re/item_db.yml
          - db/re/item_db_equip.yml
          - db/re/item_db_etc.yml
          - db/re/item_db_usable.yml
      - kind: yaml_override
        path: db/import/item_db.yml

  item_scripts:
    sources:
      - kind: item_yaml_script_fields
        paths:
          - db/re/item_db.yml
          - db/re/item_db_equip.yml
          - db/re/item_db_etc.yml
          - db/re/item_db_usable.yml
          - db/import/item_db.yml
        note: Script/EquipScript/UnEquipScript; effects_partial tags only; no LLM
      - kind: deferred
        note: callfunc expansion, getgroupitem→group, combo scripts, full semantics

  item_restrictions:
    sources:
      - kind: item_yaml_trade
        note: Trade.NoDrop/NoTrade/NoSell/… one key per row
      - kind: item_yaml_flags
        note: Flags.NoConsume only (not BuyingStore/Container)
      - kind: txt
        path: db/re/item_noequip.txt
      - kind: txt_override
        path: db/import/item_noequip.txt
      - kind: deferred
        note: Jobs stay on items; zone mapflag names; script use-blocks

  drops:
    sources:
      - kind: mob_yaml_drops
        path: db/re/mob_db.yml
        note: Drops + MvpDrops; rate unit per_10000
      - kind: yaml_override
        path: db/import/mob_db.yml
      - kind: map_drops
        path: db/re/map_drops.yml
        note: map bonus layer; Rate per_100000; is_map_bonus; no item_rate_*
      - kind: conf
        paths: [conf/battle/drops.conf, conf/import/battle_conf.txt]
        keys: [item_rate_*, item_drop_*_min/max]
        note: linear mob_drop_adjust for mob_db only; MVP list uses item_rate_mvp
      - kind: deferred
        note: verify item_rate_*_mvp via @iteminfo; enable_bonus_map_drops runtime; mob_item_ratio.yml; script/event; VIP/luk

  shops:
    sources:
      - kind: npc_shop
        note: shop/cashshop/itemshop/pointshop/marketshop lines
      - kind: barters
        path: npc/barters.yml

  quests:
    sources:
      - kind: yaml
        path: db/re/quest_db.yml
        note: Id/Title/Targets/Drops/TimeLimit
      - kind: yaml_override
        path: db/import/quest_db.yml
      - kind: npc_script_evidence
        note: quest_ids from setquest/checkquest/… → npc_quest_links
      - kind: deferred
        note: script rewards/requirements; quest type; Location→map; ozro bounty

  instances:
    sources:
      - kind: yaml
        path: db/re/instance_db.yml
        note: Id/Name/Enter/AdditionalMaps/TimeLimit
      - kind: yaml_override
        path: db/import/instance_db.yml
      - kind: npc_scripts
        path: npc/re/instances/
        note: instance_create literal → NPC links; dynamic names unbound
      - kind: deferred
        note: requirements/rewards; idle timeout; var-based create names

  boxes:
    sources:
      - kind: item_group
        path: db/re/item_group_db.yml
        note: Group/SubGroups/List Rate+Amount; algorithms All/SharedPool/Random
      - kind: yaml_override
        path: db/import/item_group_db.yml
      - kind: item_scripts
        note: getgroupitem(IG_*) → box_item_links
      - kind: deferred
        note: SharedPool probability normalize; NPC/quest reward boxes

  recipes:
    sources:
      - kind: produce_db
        path: db/re/produce_db.txt
        note: ID,ProduceItemID,ItemLV,RequireSkill,RequireSkillLv,materials…
      - kind: txt_override
        path: db/import/produce_db.txt
      - kind: deferred
        note: NPC crafting scripts; zeny/success/fail runtime

  enchantments:
    sources:
      - kind: yaml
        path: db/re/item_enchant.yml
      - kind: yaml_override
        path: db/import/item_enchant.yml
      - kind: npc_scripts
        note: refine/enchant/socket NPCs

  item_relationships:
    sources:
      - kind: yaml
        path: db/re/item_combos.yml
      - kind: yaml_override
        path: db/import/item_combos.yml

  client_resources:
    sources:
      - kind: grf
        repo: ozro_cli
        dir: tmp
      - kind: grf
        repo: ozro_cli
        dir: patch

non_sources:
  - /home/oz/Code/ozro-site
  - prior tools under ozro-cli/tools, ozro-site/tools, rathena/tools (failed designs)
